[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finrag"
version = "0.1.0"
description = "Domain-agnostic financial RAG library: hybrid retrieval, rerank, ingestion and answer generation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "finrag contributors" }]
dependencies = [
    "pymilvus>=2.4.9,<3",
]

[project.optional-dependencies]
embedding = ["FlagEmbedding==1.3.4", "torch==2.5.1"]
reranker = ["sentence-transformers==3.3.1", "transformers==4.46.0", "sentencepiece==0.2.1", "torch==2.5.1"]
llm = ["langchain-openai==1.1.10", "langchain-core==1.2.16", "httpx==0.28.1"]
ingest = [
    "langchain-community==0.4.1",
    "langchain-text-splitters==1.1.1",
    "langchain-core==1.2.16",
    "pymupdf==1.24.14",
    "pdfplumber==0.11.4",
    "python-docx==1.1.2",
]
classifier = ["transformers==4.46.0"]
web = ["duckduckgo-search==8.1.1"]
all = [
    "FlagEmbedding==1.3.4",
    "torch==2.5.1",
    "sentence-transformers==3.3.1",
    "transformers==4.46.0",
    "sentencepiece==0.2.1",
    "langchain-openai==1.1.10",
    "langchain-core==1.2.16",
    "httpx==0.28.1",
    "langchain-community==0.4.1",
    "langchain-text-splitters==1.1.1",
    "pymupdf==1.24.14",
    "pdfplumber==0.11.4",
    "python-docx==1.1.2",
    "duckduckgo-search==8.1.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
finrag = ["py.typed"]
